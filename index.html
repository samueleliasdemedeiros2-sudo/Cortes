<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipForge Pro - Cortes Virais com IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(18, 22, 34, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #ec4899;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      --glow: rgba(236, 72, 153, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    /* Ambient glow */
    .glow-bg {
      position: fixed;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 400px;
      background: radial-gradient(circle, var(--glow) 0%, rgba(0,0,0,0) 70%);
      z-index: -1;
      pointer-events: none;
    }

    header {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .logo {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.5px;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 9999px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    main {
      width: 100%;
      max-width: 680px;
    }

    .hero-text {
      text-align: center;
      margin-bottom: 28px;
    }

    .hero-text h1 {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-text p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      margin-bottom: 24px;
    }

    .input-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-field {
      width: 100%;
      background: rgba(10, 14, 23, 0.8);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.15);
    }

    .settings-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .select-box {
      width: 100%;
      background: rgba(10, 14, 23, 0.8);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      background: var(--gradient);
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 18px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px var(--glow);
      transition: all 0.2s ease;
    }

    .btn-submit:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-submit:disabled {
      background: #334155;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Results */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 20px;
    }

    .clip-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      animation: fadeIn 0.4s ease;
    }

    .clip-info h4 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .clip-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .btn-download {
      background: #10b981;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px 18px;
      border-radius: 10px;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-download:hover {
      background: #059669;
    }

    /* Loading Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 14px;
      border-radius: 14px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="glow-bg"></div>

  <header>
    <div class="logo">⚡ ClipForge Pro</div>
    <div class="status-badge">
      <div class="status-dot"></div>
      IA Conectada
    </div>
  </header>

  <main>
    <div class="hero-text">
      <h1>Crie Cortes Virais com IA</h1>
      <p>Cole o link de um vídeo do YouTube longo e deixe a inteligência artificial encontrar os melhores momentos de 60 segundos.</p>
    </div>

    <div class="card">
      <div id="errorBanner" class="error-banner"></div>

      <div class="input-group">
        <label class="input-label">Link do Vídeo do YouTube</label>
        <input 
          type="url" 
          id="ytUrl" 
          class="input-field" 
          placeholder="https://www.youtube.com/watch?v=..." 
          required
        />
      </div>

      <div class="settings-row">
        <div>
          <label class="input-label">Duração dos Cortes</label>
          <select id="duration" class="select-box">
            <option value="30">30 Segundos</option>
            <option value="60" selected>60 Segundos (Shorts/Reels)</option>
            <option value="90">90 Segundos</option>
          </select>
        </div>
        <div>
          <label class="input-label">Quantidade</label>
          <select id="quantity" class="select-box">
            <option value="3">3 Melhores Cortes</option>
            <option value="5" selected>5 Melhores Cortes</option>
            <option value="8">8 Melhores Cortes</option>
          </select>
        </div>
      </div>

      <button id="btnProcess" class="btn-submit" onclick="processarVideo()">
        <span>Gerar Cortes Automáticos</span>
      </button>

      <div id="results" class="results-container"></div>
    </div>
  </main>

  <script>
    // URL do seu servidor Express no Render
    const API_URL = 'https://cortesyou.onrender.com';

    async function processarVideo() {
      const input = document.getElementById('ytUrl');
      const duration = document.getElementById('duration').value;
      const quantity = document.getElementById('quantity').value;
      const btn = document.getElementById('btnProcess');
      const banner = document.getElementById('errorBanner');
      const resultsContainer = document.getElementById('results');

      const url = input.value.trim();

      // Validação básica do YouTube
      if (!url || (!url.includes('youtube.com/') && !url.includes('youtu.be/'))) {
        banner.innerText = 'Por favor, insira um link válido do YouTube.';
        banner.style.display = 'block';
        return;
      }

      banner.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Processando com IA...';
      resultsContainer.innerHTML = '';

      try {
        const response = await fetch(`${API_URL}/api/analisar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ youtubeUrl: url, duration, quantity })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Erro ao comunicar com o servidor.');
        }

        // Renderiza os cortes retornados pelo backend
        data.clips.forEach((clip, index) => {
          const card = document.createElement('div');
          card.className = 'clip-card';
          card.innerHTML = `
            <div class="clip-info">
              <h4>${clip.title}</h4>
              <p>⏱️ ${clip.start}s até ${clip.end}s • Score Viral: ${clip.potential || '95%'}</p>
            </div>
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="btn-download">
              Baixar
            </a>
          `;
          resultsContainer.appendChild(card);
        });

      } catch (err) {
        banner.innerText = 'O servidor está iniciando ou houve uma falha. Tente novamente em instantes.';
        banner.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Gerar Cortes Automáticos</span>';
      }
    }
  </script>
</body>
</html>
