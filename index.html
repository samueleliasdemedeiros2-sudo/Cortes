  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    const API_URL = 'https://cortesyou.onrender.com';

    async function executarCortes() {
      const input = document.getElementById('ytLink');
      const duration = document.getElementById('clipDuration').value;
      const quantity = document.getElementById('clipQuantity').value;
      const btn = document.getElementById('btnSubmit');
      const msg = document.getElementById('statusMessage');
      const resultsList = document.getElementById('resultsList');

      const url = input.value.trim();

      if (!url || (!url.includes('youtube.com/') && !url.includes('youtu.be/'))) {
        msg.innerText = 'Insira um endereço válido do YouTube.';
        msg.style.display = 'block';
        return;
      }

      msg.style.display = 'none';
      btn.disabled = true;
      btn.style.opacity = '0.5';
      resultsList.innerHTML = '';

      try {
        const res = await fetch(`${API_URL}/api/analisar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ youtubeUrl: url, duration, quantity })
        });

        const data = await res.json();
        if (!res.ok || !data.success) throw new Error();

        data.clips.forEach(clip => {
          const item = document.createElement('div');
          item.className = 'result-card';
          item.innerHTML = `
            <div class="result-info">
              <h4>${clip.title}</h4>
              <p>⚡ Score Viral: ${clip.potential} (${clip.duration}s)</p>
            </div>
            <button class="btn-download-clip" onclick="descarregarCorte(this, '${clip.originalUrl}', ${clip.start}, ${clip.duration})">
              Baixar MP4
            </button>
          `;
          resultsList.appendChild(item);
        });

      } catch (err) {
        msg.innerText = 'Servidor em processamento. Tente novamente em instantes.';
        msg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }

    // Função que pede o corte renderizado ao backend e inicia o download
    async function descarregarCorte(btnElement, videoUrl, start, duration) {
      const textoOriginal = btnElement.innerText;
      btnElement.disabled = true;
      btnElement.innerText = 'Processando...';

      try {
        const res = await fetch(`${API_URL}/api/gerar-corte?url=${encodeURIComponent(videoUrl)}&start=${start}&duration=${duration}`);
        const data = await res.json();

        if (data.success && data.downloadUrl) {
          // Cria o download automático do ficheiro MP4
          const a = document.createElement('a');
          a.href = data.downloadUrl;
          a.setAttribute('download', `corte_${start}.mp4`);
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          btnElement.innerText = 'Concluído!';
        } else {
          alert('Erro ao gerar corte de vídeo no servidor.');
          btnElement.innerText = textoOriginal;
        }
      } catch (e) {
        alert('O servidor demorou a responder. Tente novamente.');
        btnElement.innerText = textoOriginal;
      } finally {
        btnElement.disabled = false;
      }
    }
  </script>
